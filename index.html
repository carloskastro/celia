<!DOCTYPE html>
<html lang="es-CO">

<body>
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Logo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" aria-label="boton menu"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">

                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Carousel -->
        <div id="demo" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators/dots -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-label="boton1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="boton2"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="boton3"></button>
            </div>

            <!-- The slideshow/carousel -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="assets/media/foto1.jpg" alt="Foto1" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="assets/media/foto2.jpg" alt="Foto2" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="assets/media/foto3.jpg" alt="Foto3" class="d-block w-100">
                </div>
            </div>

            <!-- Left and right controls/icons -->
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev" aria-label="botonprev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next" aria-label="botonnext">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
